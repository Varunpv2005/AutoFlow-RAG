# Render Blueprint for AutoFlow-RAG Production Deployment
services:
  - type: web
    name: autoflow-rag-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CHAT_RAG_ADMIN_TOKEN
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      - key: CORS_ALLOWED_ORIGINS
        value: https://autoflow-rag-frontend.onrender.com,http://localhost:3000

  - type: web
    name: autoflow-rag-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    region: oregon
