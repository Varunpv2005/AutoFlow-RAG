services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoflow-rag-backend
    env_file:
      - ./backend/.env
    environment:
      - FAISS_PATH=/app/data/faiss_index
      - UPLOAD_DIR=/data/files
    volumes:
      - faiss_data:/app/data/faiss_index
      - upload_data:/data/files
      - sqlite_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autoflow-rag-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  faiss_data:
  upload_data:
  sqlite_data:
